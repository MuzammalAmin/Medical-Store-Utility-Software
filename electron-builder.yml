# Windows installer (PRD §4, §6.2). Build with: npm run dist
appId: pk.ayyazpharmacy.manager
productName: Ayyaz Pharmacy Manager
copyright: Copyright © 2026 Ayyaz Pharmacy

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/*.map'
  # Only the Windows x64 SQLite binary is needed; drop the C sources and other platforms.
  - '!node_modules/better-sqlite3/{deps,src}/**'
  - '!node_modules/better-sqlite3/prebuilds/{darwin,linux,linuxmusl}-*.node'
  - '!node_modules/better-sqlite3/prebuilds/win32-arm64.node'
  # Type definitions, TypeScript sources, docs and exceljs's browser bundle are never loaded at runtime.
  - '!node_modules/**/*.{ts,mts,cts,map,md}'
  - '!node_modules/exceljs/dist/**'

# Keeps the installer under GitHub's 100 MB file limit so it can live in the repo.
compression: maximum
electronLanguages:
  - en-US
afterPack: build/after-pack.cjs

# SQL migrations are applied at start-up from resources/migrations.
extraResources:
  - from: db/migrations
    to: migrations

# The SQLite driver ships prebuilt N-API binaries that work in Electron as-is,
# so no native rebuild (and no Visual Studio) is needed.
npmRebuild: false

asar: true
# Native SQLite module must live outside the archive.
asarUnpack:
  - node_modules/better-sqlite3/**

# Electron fuses: switch off features this app never needs, so they can't be abused.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  # Code signing: set CSC_LINK / CSC_KEY_PASSWORD in the environment once a certificate is bought.

nsis:
  artifactName: Ayyaz-Pharmacy-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Ayyaz Pharmacy
  # Never delete pharmacy data when the app is uninstalled.
  deleteAppDataOnUninstall: false
